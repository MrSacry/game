<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Hot and Cold Game</title>\n    <link rel=\"stylesheet\" href=\"https://unpkg.com/leaflet/dist/leaflet.css\" />\n    <style>\n        #map { height: 500px; }\n    </style>\n</head>\n<body>\n    <h1>Hot and Cold Game</h1>\n    <div id=\"map\"></div>\n    <input type=\"text\" id=\"guess\" placeholder=\"Enter your guess coordinates...\"/>\n    <button id=\"submit\">Submit</button>\n    <p id=\"feedback\"></p>\n    <script src=\"https://unpkg.com/leaflet/dist/leaflet.js\"></script>\n    <script>\n        const map = L.map('map').setView([0, 0], 2);\n        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);\n        const targetLocation = [51.505, -0.09]; // This is the target location for the game\n        let currentDistance;\n\n        function calcDistance(lat1, lon1, lat2, lon2) {\n            const R = 6371; // Radius of the Earth in km\n            const dLat = (lat2 - lat1) * Math.PI / 180;\n            const dLon = (lon2 - lon1) * Math.PI / 180;\n            const a = \n                Math.sin(dLat / 2) * Math.sin(dLat / 2) +\n                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *\n                Math.sin(dLon / 2) * Math.sin(dLon / 2);\n            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));\n            return R * c; // Distance in km\n        }\n\n        document.getElementById('submit').addEventListener('click', function() {\n            const guess = document.getElementById('guess').value.split(',').map(Number);\n            if (guess.length === 2) {\n                const distance = calcDistance(guess[0], guess[1], targetLocation[0], targetLocation[1]);\n                document.getElementById('feedback').innerText = \"Distance from target: \" + distance.toFixed(2) + \" km\";\n            } else {\n                document.getElementById('feedback').innerText = \"Please enter valid coordinates (lat, lon)\";\n            }\n        });\n    <\/script>\n</body>\n</html>\n
